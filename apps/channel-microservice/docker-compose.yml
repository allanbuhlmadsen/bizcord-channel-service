services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bizcord-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  vault:
    image: hashicorp/vault:1.21.0
    container_name: bizcord-vault
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200

  fluentd:
    image: fluent/fluentd:latest
    container_name: bizcord-fluentd
    user: root
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - /var/lib/docker/containers:/fluentd/log/containers:ro
    environment:
      - FLUENTD_CONF=fluent.conf
    logging:
      driver: "local"

  channel-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizcord-channel-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_started
      fluentd:
        condition: service_started
    ports:
      - "8000:8080"
    logging:
      driver: "json-file"
    environment:
      - "Messaging__Host=rabbitmq"
      - "Vault__Address=http://vault:8200"
      - "VAULT_TOKEN=${VAULT_TOKEN}"

volumes:
  vault-data: