services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bizcord-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  vault:
    image: hashicorp/vault:1.21.0
    container_name: bizcord-vault
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200

  channel-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizcord-channel-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_started
    ports:
      - "8000:8080"
    environment:
      - "Messaging__Host=rabbitmq"
      - "Vault__Address=http://vault:8200"
      - "VAULT_TOKEN=${VAULT_TOKEN}"

volumes:
  vault-data: